[build]
  publish = "public"
  functions = "netlify/functions"

# Proxy katalog -> Netlify Function (pengganti server.js saat lokal)
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

# Halaman lama/tidak ada -> index.html (SPA).
# Sengaja memakai regex eksplisit: pola "/*" menangkap semua path sehingga
# function berbasis file (/health, /catalog, ...) ikut tertelan.
[[redirects]]
  from = "/*.html"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/index.html"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer-when-downgrade"
